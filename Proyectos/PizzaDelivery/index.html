        <div class="Formulario">
            <h1>Hace tu pedido</h1>
            <main>
                        <form action="#" method="post">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" required placeholder="Ingrese Nombre"> <br>
        
        <label for="apellido">Apellido:</label>
        <input type="text" id="apellido" required placeholder="Ingrese Apellido"> <br>
        
        <label for="direccion">Direccion:</label>

        <label for="pedido">Pedido:</label>
        <input type="text" id="pedido" name="pedido" required placeholder="Ingrese su pedido"><br>
        
        <label for="mensaje">Agregado (opcional):</label>
        <input type="text" id="mensaje" name="mensaje" placeholder="Ingrese agregados"><br>
        
        
        <label>Recibi tu pedido</label>
        <input type="radio" id="envio" name="recibi" value="envio" required>
        <label for="envio">Envio a domicilio</label>
        <input type="radio" id="local" name="recibi" value="local" required>
        <label for="local">Retiro del local</label>
        <br><br>
